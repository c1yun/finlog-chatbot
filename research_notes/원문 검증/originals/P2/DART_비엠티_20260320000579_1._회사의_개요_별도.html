<TR height='168'>
  <TD width='591' height='161'>회사는 1988년 2월 반도체 피팅 및 반도체 밸브 제조를 목적으로 경풍기계공업사로 설립되었으며, 2000년 7월 26일 현물출자 방식으로 법인기업으로 전환하고 상호를 주식회사 비엠티로 변경하였으며, 2007년 11월 2일 주식을 KOSDAQ증권시장에 상장하였습니다. 회사의 본점 소재지는 부산시 기장군입니다. <BR/><BR/>2025년 12월 31일 현재 납입자본금은 4,962,943천원이며 최대주주는 36.52%의 지분을 소유하고 있는 대표이사 윤종찬입니다.</TD>
