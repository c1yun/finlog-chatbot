<style>
/* Layout: phone-first app for a snowy Sapporo trip. Sticky day bar on top, fixed five-tab bar at the bottom, one column of large-type cards. */
:root {

:root[data-theme="dark"] {

const store = {

  set(k, v) { try { localStorage.setItem('sp:' + k, JSON.stringify(v)); } catch (e) {} },

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const img = k => IMG[k] ? `<img src="${IMG[k]}" alt="" loading="lazy">` : '';
const TRIP = ['TUE', 'WED', 'THU', 'FRI'];
function mapQuery(s, day) {
  const fix = (MANUAL.mapFix || {})[(day ? dayKey(day) : '') + ' ' + (s.time || '')] || {};
  if (fix.nomap || s.nomap) return null;
  let q = fix.map || s.map || '';
  if (!q) {
    let v = s.vi || '';
    if (v.includes('→')) v = v.split('→').pop();
    v = v.replace(/\(([^)]*)\)/g, (m, g) => /^\s*\d/.test(g) ? ' ' + g + ' ' : ' ');
    v = v.replace(/[가-힣][^,·]*/g, ' ').replace(/\s*·\s*/g, ' ').replace(/\s+/g, ' ').trim();
    q = v;
  }
  if (!q) return null;
  const hasCity = /Sapporo|札幌|Otaru|小樽|Biei|美瑛|Furano|富良野|Chitose|千歳|Jozankei|定山渓|Hokkaido|北海道/i.test(q);
  const city = (hasCity || /^-?\d+\.\d+,\s*-?\d+\.\d+$/.test(q)) ? '' : (fix.city || s.city || 'Sapporo');
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(city ? q + ' ' + city : q);
}
const mapUrl = (vi, title, city) => mapQuery({ vi: vi || title, city }, null);
const telHref = p => 'tel:' + String(p).replace(/[^\d+#]/g, '').replace(/#/g, '%23');
function toast(msg, undo) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  if (undo) { const b = document.createElement('button'); b.type = 'button'; b.className = 'undo'; b.textContent = '되돌리기'; b.addEventListener('click', () => { undo(); t.remove(); }); t.appendChild(b); }
  document.body.appendChild(t); setTimeout(() => t.remove(), undo ? 6000 : 1600);
}
function copyText(txt, el) {
  const done = () => toast('복사했어요');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(() => fallback());
  else fallback();
  function fallback() { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('길게 눌러 복사하세요'); }
}

function isoToday() { const n = new Date(); return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0'); }
function renderSchedule(main, top) {
  const saved = store.get('day', null); const iso = isoToday(); const today = todayKey(); const inTrip = !!DAY_BY_ISO[iso];
  let cur = (saved && typeof saved === 'object' && saved.on === iso && saved.k) || (inTrip ? today : null) || (saved && typeof saved === 'object' ? saved.k : saved) || today;
  if (!DAYS.some(d => dayKey(d) === cur)) cur = 'TUE';
  top.innerHTML = `<div class="brand"><h1>엄마와 삿포로 4일</h1></div>
    <div class="daybar" role="tablist">${DAYS.map(d => `<button class="daychip${dayKey(d) === cur ? ' on' : ''}" role="tab" aria-selected="${dayKey(d) === cur}" data-day="${dayKey(d)}">${inTrip && dayKey(d) === today ? '<span class="today">오늘</span>' : ''}<b>${DAY_KO[dayKey(d)]}</b><span>${esc(d.date.replace(/^[A-Z]{3} · /, ''))}</span></button>`).join('')}</div>`;
  top.querySelectorAll('.daychip').forEach(b => b.addEventListener('click', () => { store.set('day', { k: b.dataset.day, on: isoToday() }); route(); const nb = top.querySelector(`[data-day="${b.dataset.day}"]`); if (nb) nb.focus({ preventScroll: true }); }));
  const onChip = top.querySelector('.daychip.on'); if (onChip && onChip.scrollIntoView) onChip.scrollIntoView({ inline: 'nearest', block: 'nearest' });
  const d = DAYS.find(x => dayKey(x) === cur);
  const ch = d.choices || null; let pick = null;
  if (ch) { pick = store.get('choice:' + dayKey(d), ch[0].k); if (!ch.some(c => c.k === pick)) pick = ch[0].k; }
  const stops = (d.stops || []).filter(s => !s.opt || !pick || (Array.isArray(s.opt) ? s.opt.includes(pick) : s.opt === pick));
  if (pick) stops.sort((a, b) => a.time.localeCompare(b.time));
  const choiceHtml = ch ? `<p class="choice-h">오늘 갈 곳을 하나 골라요</p><div class="choice" role="radiogroup" aria-label="오늘 갈 곳 고르기">${ch.map(c => `<button type="button" role="radio" aria-checked="${c.k === pick}" class="${c.k === pick ? 'on' : ''}" data-choice="${c.k}"><b>${esc(c.label)}</b><span>${esc(c.sub || '')}</span></button>`).join('')}</div>` : '';
  main.innerHTML = `<div class="dayhead"><div class="date">${esc(d.long || d.date)}</div><h2>${esc(d.title)}${d.wx ? `<span class="wx">${esc(d.wx)}</span>` : ''}</h2>${d.summary ? `<div class="summary">${esc(d.summary)}</div>` : ''}</div>
    ${(d.notes || []).map(n => `<div class="note">${n}</div>`).join('')}
    ${choiceHtml}
    ${stops.map(s => `<div class="stop"><div class="t">${esc(s.time)}${s.variant ? `<small>${esc(s.variant)}</small>` : ''}</div>${stopCard(s, d)}</div>`).join('')}
    ${d.planb ? `<details class="planb"><summary>눈 오거나 사정이 생기면</summary><div class="pb">${d.planb.split(/\s+(?=<b>)/).filter(Boolean).map(x => `<p>${x}</p>`).join('')}</div></details>` : ''}`;
  main.querySelectorAll('[data-choice]').forEach(b => b.addEventListener('click', () => {
    store.set('choice:' + dayKey(d), b.dataset.choice); route();
    const c = document.querySelector('.choice'); if (c) { c.scrollIntoView({ block: 'start' }); window.scrollBy(0, -(document.querySelector('.top').offsetHeight + 8)); }
    const nb = document.querySelector(`[data-choice="${b.dataset.choice}"]`); if (nb) nb.focus({ preventScroll: true });
  }));
  wireCopy(main);
}
const DAY_BY_ISO = { '2027-03-09': 'TUE', '2027-03-10': 'WED', '2027-03-11': 'THU', '2027-03-12': 'FRI' };
function todayKey() { const iso = isoToday(); if (DAY_BY_ISO[iso]) return DAY_BY_ISO[iso]; return iso < '2027-03-09' ? 'TUE' : 'FRI'; }
function wireCopy(root) {
  root.querySelectorAll('[data-copybtn]').forEach(b => b.addEventListener('click', () => { const box = b.closest('.body, .row') || root; const el = box.querySelector('[data-copy]'); if (el) copyText(el.textContent, el); }));
}

// category pages built from the schedule plus manual extras
function entriesFor(cat) {
  const out = [];
  DAYS.forEach(d => (d.stops || []).forEach(s => {
    const c = (CAT.byKey || {})[s.img] || (CAT.byTitle || {})[s.title];
    const plan = s.opt && !Array.isArray(s.opt) && d.choices ? ' · ' + ((d.choices.find(x => x.k === s.opt) || {}).label || '') : '';
    if (c && c.cat === cat) out.push({ ...s, group: c.group || '', when: DAY_KO[dayKey(d)] + ' ' + s.time + plan + (s.variant ? ' ' + s.variant : ''), day: d, sortKey: TRIP.indexOf(dayKey(d)) + s.time });
  }));
  (MANUAL.extra || []).filter(e => e.cat === cat).forEach(e => out.push({ ...e, day: DAYS.find(d => dayKey(d) === (e.dayKey || 'FRI')), sortKey: TRIP.indexOf(e.dayKey || 'FRI') + (e.time || '99:99') }));
  return out;
}

  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { const target = b.dataset.tab === 'lists' ? (store.get('sub', 'shopping')) : b.dataset.tab; if ((location.hash || '#schedule').replace('#', '') === target) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; } location.hash = target; }));
  const main = document.getElementById('main'), top = document.getElementById('top');
  if (tab === 'schedule') renderSchedule(main, top);
  else if (tab === 'food') renderCategory(main, top, 'food', '먹기', '아침·점심·저녁과 카페, 날짜순', MANUAL.groups && MANUAL.groups.food);
  else if (tab === 'shop') renderCategory(main, top, 'shop', '쇼핑', '어디서 무엇을 살지, 날짜순', MANUAL.groups && MANUAL.groups.shop);
  else if (tab === 'todo') renderCategory(main, top, 'todo', '할 것', '보고 걷고 배우는 것들', MANUAL.groups && MANUAL.groups.todo);
  else { const sub = SUB[h] ? h : store.get('sub', 'shopping'); store.set('sub', sub); renderLists(main, top, sub); }
  const brand = top.querySelector('.brand');
  if (brand) { brand.insertAdjacentHTML('beforeend', zoomBtn()); document.getElementById('zoomToggle').addEventListener('click', e => { store.set('big', !store.get('big', false)); applyZoom(); e.currentTarget.setAttribute('aria-pressed', store.get('big', false) ? 'true' : 'false'); e.currentTarget.textContent = store.get('big', false) ? '글자 작게' : '글자 크게'; }); }
  const tb = document.querySelector(`.tab[data-tab="${tab}"]`); if (tb && document.activeElement && document.activeElement.tagName === 'BODY') { /* keep natural focus */ }
  window.scrollTo({ top: 0 });
}
window.addEventListener('hashchange', route);
// Opening cover: shown once per app launch. A photo chosen on this phone replaces the default photo, on this phone only.
const COVER_KEY = (MANUAL.cover && MANUAL.cover.img) || 'poster';
function ddayText() {
  const [y, m, d] = isoToday().split('-').map(Number), t = Date.UTC(y, m - 1, d);
  const n = Math.round((Date.UTC(2027, 2, 9) - t) / 864e5);
  if (n > 0) return '출발까지 ' + n + '일';
  if (t <= Date.UTC(2027, 2, 12)) return '여행 ' + (1 - n) + '일째';
  return '다녀온 여행';
}
function paintCover() {
  const c = document.getElementById('cover'), own = store.get('coverImg', null), bg = document.getElementById('coverBg'), im = document.getElementById('coverImg');
  const src = own || IMG[COVER_KEY] || '';
  const whole = !!own || (!!IMG[COVER_KEY] && (MANUAL.cover || {}).mode === 'poster');
  c.classList.toggle('custom', whole);
  if (src) { bg.src = src; bg.hidden = false; } else bg.hidden = true;
  im.hidden = !whole; if (whole) im.src = src;
  const cr = CREDITS[COVER_KEY];
  document.getElementById('coverCredit').textContent = own || !cr ? '' : ((MANUAL.cover || {}).credit || `사진 ${cr.author || ''} · ${cr.license || ''}`);
  document.getElementById('coverReset').hidden = !own;
  document.getElementById('coverDday').textContent = ddayText();
}
function showCover() {
  paintCover();
  document.getElementById('cover').hidden = false; document.body.classList.add('cover-on');
}
function hideCover() {
  document.getElementById('cover').hidden = true; document.body.classList.remove('cover-on');
  if ((location.hash || '#schedule') !== '#schedule') location.hash = 'schedule'; else window.scrollTo({ top: 0 });
  try { sessionStorage.setItem('sp:cover', '1'); } catch (e) {}
}
function useCoverPhoto(file) {
  if (!file) return;
  const im = new Image(), url = URL.createObjectURL(file);
  im.onload = () => {
    const k = Math.min(1, 1200 / Math.max(im.naturalWidth, im.naturalHeight)), cv = document.createElement('canvas');
    cv.width = Math.round(im.naturalWidth * k); cv.height = Math.round(im.naturalHeight * k);
    cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
    const data = cv.toDataURL('image/jpeg', 0.85);
    store.set('coverImg', data);
    if (store.get('coverImg', null) === data) { paintCover(); toast('표지 사진을 바꿨어요'); }
    else { paintCover(); document.getElementById('cover').classList.add('custom'); const ci = document.getElementById('coverImg'); ci.src = data; ci.hidden = false; document.getElementById('coverBg').src = data; toast('이 폰에 저장이 안 돼서 이번만 보여요'); }
  };
  im.onerror = () => { URL.revokeObjectURL(url); toast('이 사진은 열 수 없어요'); };
  im.src = url;
}
document.getElementById('coverGo').addEventListener('click', hideCover);
document.getElementById('coverPick').addEventListener('click', () => document.getElementById('coverFile').click());
document.getElementById('coverFile').addEventListener('change', e => { useCoverPhoto(e.target.files && e.target.files[0]); e.target.value = ''; });
document.getElementById('coverReset').addEventListener('click', () => { try { localStorage.removeItem('sp:coverImg'); } catch (e) {} paintCover(); toast('원래 표지로 돌렸어요'); });
let coverSeen = false; try { coverSeen = sessionStorage.getItem('sp:cover') === '1'; } catch (e) {}
if (!coverSeen) showCover();
route();
