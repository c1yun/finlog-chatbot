<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta name="theme-color" content="{{PRIMARY}}">
<link rel="icon" href="{{FAVICON}}">
<style>
:root{{{THEME_VARS}}}
/*{{CSS}}*/
</style>
</head>
<body>
<div class="app">
  <header class="hd">
    <div class="av" id="hdav"></div>
    <div><h1 id="bname"></h1><p id="btag"></p></div>
  </header>
  <main class="chat" id="chat" role="log" aria-live="polite" aria-label="대화 내용"></main>
  <nav class="quick" id="quick" aria-label="빠른 메뉴"></nav>
  <form class="composer" id="form" autocomplete="off">
    <input id="inp" maxlength="200" placeholder="궁금한 것을 입력하세요" aria-label="질문 입력" enterkeyhint="send">
    <button id="send" type="submit" aria-label="보내기">➤</button>
  </form>
  <footer class="ft" id="ft"></footer>
</div>
<noscript><p style="padding:20px">이 챗봇은 자바스크립트가 켜져 있어야 동작합니다.</p></noscript>
<script>window.BOT={{DATA}};</script>
<script>/*{{ENGINE}}*/</script>
<script>/*{{UI}}*/</script>
</body>
</html>
